name: Destroy AWS Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type DESTROY to confirm deletion of all AWS resources'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Destroy EKS Infrastructure
    runs-on: ubuntu-latest

    environment:
      name: dev

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      BOOTSTRAP_ROLE_ARN: ${{ vars.BOOTSTRAP_ROLE_ARN }}

    steps:
      - name: Validate destroy confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "ERROR: You must type DESTROY to continue."
            exit 1
          fi

          echo "Destroy confirmation accepted."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------
      # Configure kubectl
      # ------------------------------------------
      - name: Terraform Init - EKS
        working-directory: common/bootstrap-state
        run: |
          terraform init

      # ------------------------------------------
      # Configure kubectl
      # ------------------------------------------
      - name: Configure kubectl
        working-directory: common/terraform
        run: |
          CLUSTER_NAME=$(terraform output -raw eks_cluster_name)

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME"

          kubectl get nodes
    
      # ------------------------------------------
      # Delete Kubernetes applications first
      # ------------------------------------------
      - name: Delete Kubernetes resources
        run: |
          echo "Deleting Kubernetes applications..."

          kubectl delete all \
            --all \
            --all-namespaces \
            --ignore-not-found=true

      # ------------------------------------------
      # Delete EKS infrastructure
      # ------------------------------------------
      - name: Terraform Destroy - EKS
        working-directory: common/terraform
        run: |
          terraform destroy \
            -auto-approve

      # ------------------------------------------
      # Delete Terraform backend
      # ------------------------------------------
      - name: Terraform Init - Bootstrap State
        working-directory: common/bootstrap-state
        run: |
          terraform init

      - name: Terraform Destroy - Bootstrap State
        working-directory: common/bootstrap-state
        run: |
          terraform destroy \
            -auto-approve

      # ------------------------------------------
      # Completion
      # ------------------------------------------
      - name: Destroy completed
        run: |
          echo "======================================"
          echo "AWS infrastructure destroyed."
          echo "======================================"
